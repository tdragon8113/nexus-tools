# 仅发布 web-tools Electron 桌面端。Tag 规则见 docs/RELEASE_TAGS.md
name: Release web-tools Desktop

on:
  push:
    tags:
      - 'web-tools-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
            artifact_file: NexusTools.dmg
            artifact_name: NexusTools-mac
          - os: windows-latest
            platform: win
            dist_script: dist:win
            artifact_file: NexusTools-setup.exe
            artifact_name: NexusTools-win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/web-tools-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/web-tools-v}"
          else
            VERSION="0.0.0-ci"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=web-tools-v${VERSION}" >> "$GITHUB_ENV"
          echo "Building Nexus Tools desktop (${{ matrix.platform }}) web-tools-v${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web-tools/package-lock.json
            web-tools/desktop/package-lock.json

      - name: Install dependencies
        shell: bash
        working-directory: web-tools
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Set desktop package version
        shell: bash
        working-directory: web-tools/desktop
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate static web
        shell: bash
        working-directory: web-tools
        run: npm run generate

      - name: Build Electron (${{ matrix.platform }})
        shell: bash
        working-directory: web-tools/desktop
        run: npm run ${{ matrix.dist_script }}

      - name: Stage release artifact (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p dist
          RELEASE_DIR=web-tools/desktop/release
          DMG=$(find "$RELEASE_DIR" -maxdepth 1 -name 'NexusTools.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "NexusTools.dmg not found under $RELEASE_DIR"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          cp "$DMG" "dist/${{ matrix.artifact_file }}"
          shasum -a 256 "dist/${{ matrix.artifact_file }}"
          # electron-updater：latest-mac.yml + zip + blockmap
          find "$RELEASE_DIR" -maxdepth 1 \( -name 'latest-mac.yml' -o -name '*.blockmap' -o -name 'NexusTools*.zip' \) -exec cp -f {} dist/ \;
          ls -la dist/

      - name: Stage release artifact (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $releaseDir = 'web-tools/desktop/release'
          $exe = Get-ChildItem -Path $releaseDir -Filter 'NexusTools-setup.exe' -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error 'NexusTools-setup.exe not found under web-tools/desktop/release'
            Get-ChildItem -Path $releaseDir -ErrorAction SilentlyContinue
            exit 1
          }
          Copy-Item $exe.FullName "dist/${{ matrix.artifact_file }}"
          Get-FileHash "dist/${{ matrix.artifact_file }}" -Algorithm SHA256 | Format-List
          Get-ChildItem -Path $releaseDir -File | Where-Object {
            $_.Name -eq 'latest.yml' -or $_.Name -like '*.blockmap'
          } | ForEach-Object { Copy-Item $_.FullName dist/ }
          Get-ChildItem dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/web-tools-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          RELEASE_TAG=${GITHUB_REF#refs/tags/}
          VERSION="${RELEASE_TAG#web-tools-v}"
          echo "Extracting changelog for $RELEASE_TAG (semver $VERSION)"

          PREV_TAG=$(git tag -l 'web-tools-v*' --sort=-version:refname | sed -n '2p')

          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/{ found=0 }
            /^## \[/ {
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
              if ($0 ~ "^## \\[v" ver "\\]") { found=1; next }
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/d')

          FULL_CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            FULL_CHANGELOG="\n\n---\n\n**Full Changelog**: https://github.com/tdragon8113/nexus-tools/compare/${PREV_TAG}...${RELEASE_TAG}"
          fi

          if [ -z "$CHANGELOG" ]; then
            echo "use_auto=true" >> $GITHUB_OUTPUT
          else
            echo "use_auto=false" >> $GITHUB_OUTPUT
            {
              echo 'body<<EOF'
              echo "$CHANGELOG"
              echo -e "$FULL_CHANGELOG"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NexusTools-*
          merge-multiple: true
          path: dist

      - name: Flatten release assets
        run: |
          find dist -name 'NexusTools.dmg' -exec cp -f {} dist/ \;
          find dist -name 'NexusTools-setup.exe' -exec cp -f {} dist/ \;
          find dist -name 'NexusTools*.zip' -exec cp -f {} dist/ \;
          find dist -name 'latest*.yml' -exec cp -f {} dist/ \;
          find dist -name '*.blockmap' -exec cp -f {} dist/ \;
          ls -la dist/
          test -f dist/NexusTools.dmg
          test -f dist/NexusTools-setup.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NexusTools.dmg
            dist/NexusTools-setup.exe
            dist/NexusTools*.zip
            dist/latest*.yml
            dist/*.blockmap
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.use_auto == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/web-tools-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/web-tools-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "web-tools-v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "NexusTools.dmg"

      - name: Calculate SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 NexusTools.dmg | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SHA=${{ steps.sha.outputs.sha }}

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TAP_TOKEN secret is not set; skip homebrew-tap update"
            exit 0
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/tdragon8113/homebrew-tap.git"
          cd homebrew-tap

          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{SHA256}}/${SHA}/" \
              "${GITHUB_WORKSPACE}/homebrew/Casks/nexus-tools.rb" > Casks/nexus-tools.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nexus-tools.rb
          git commit -m "Update nexus-tools to v${VERSION} (Electron desktop)"
          git push
