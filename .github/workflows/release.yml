# 仅发布 web-tools Electron 桌面端。Tag 规则见 docs/RELEASE_TAGS.md
name: Release web-tools Desktop

on:
  push:
    tags:
      - 'web-tools-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/web-tools-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/web-tools-v}"
          else
            VERSION="0.0.0-ci"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=web-tools-v${VERSION}" >> "$GITHUB_ENV"
          echo "Building Nexus Tools desktop web-tools-v${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web-tools/package-lock.json
            web-tools/desktop/package-lock.json

      - name: Install dependencies
        working-directory: web-tools
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Set desktop package version
        working-directory: web-tools/desktop
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate static web
        working-directory: web-tools
        run: npm run generate

      - name: Build Electron DMG
        working-directory: web-tools/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Ad-hoc sign app in DMG (optional, improves local open)
        run: |
          APP=$(find web-tools/desktop/release -maxdepth 1 -name '*.app' -print -quit)
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP" || true
          fi

      - name: Stage release artifact
        run: |
          mkdir -p dist
          DMG=$(find web-tools/desktop/release -maxdepth 1 -name 'NexusTools.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "NexusTools.dmg not found under web-tools/desktop/release"
            ls -la web-tools/desktop/release || true
            exit 1
          fi
          cp "$DMG" dist/NexusTools.dmg
          shasum -a 256 dist/NexusTools.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusTools
          path: dist/NexusTools.dmg

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/web-tools-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          RELEASE_TAG=${GITHUB_REF#refs/tags/}
          VERSION="${RELEASE_TAG#web-tools-v}"
          echo "Extracting changelog for $RELEASE_TAG (semver $VERSION)"

          PREV_TAG=$(git tag -l 'web-tools-v*' --sort=-version:refname | sed -n '2p')

          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/{ found=0 }
            /^## \[/ {
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
              if ($0 ~ "^## \\[v" ver "\\]") { found=1; next }
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/d')

          FULL_CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            FULL_CHANGELOG="\n\n---\n\n**Full Changelog**: https://github.com/tdragon8113/nexus-tools/compare/${PREV_TAG}...${RELEASE_TAG}"
          fi

          if [ -z "$CHANGELOG" ]; then
            echo "use_auto=true" >> $GITHUB_OUTPUT
          else
            echo "use_auto=false" >> $GITHUB_OUTPUT
            {
              echo 'body<<EOF'
              echo "$CHANGELOG"
              echo -e "$FULL_CHANGELOG"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: NexusTools
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NexusTools.dmg
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.use_auto == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/web-tools-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "web-tools-v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "NexusTools.dmg"

      - name: Calculate SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 NexusTools.dmg | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SHA=${{ steps.sha.outputs.sha }}

          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret is not set; skip homebrew-tap update"
            exit 0
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/tdragon8113/homebrew-tap.git"
          cd homebrew-tap

          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{SHA256}}/${SHA}/" \
              "${GITHUB_WORKSPACE}/homebrew/Casks/nexus-tools.rb" > Casks/nexus-tools.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nexus-tools.rb
          git commit -m "Update nexus-tools to v${VERSION} (Electron desktop)"
          git push
