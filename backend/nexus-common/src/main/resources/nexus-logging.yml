# 各服务 spring.config.import 引入
# 规范：访问日志（HTTP 层）与业务日志（Application 层）分离；traceId 由 Brave 写入 MDC

spring:
  reactor:
    context-propagation: auto

# 访问日志 req/res 参数（脱敏 + 截断），见 HttpAccessLogProperties
nexus:
  http-access-log:
    log-payload: true
    max-payload-length: 2048

logging:
  file:
    name: logs/${spring.application.name}.log
  level:
    root: INFO
    com.nexus: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.cloud: WARN
    org.springframework.cloud.gateway: INFO
    org.apache.ibatis: WARN
    com.alibaba.nacos: WARN
    io.lettuce: WARN
    io.netty: WARN
    reactor.netty: WARN
